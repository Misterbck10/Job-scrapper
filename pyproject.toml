[project]
name = "job-scrapper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiolimiter>=1.3.0",
    "alembic>=1.20.0",
    "arq>=0.28.0",
    "asyncpg>=0.31.0",
    "bleach>=6.4.0",
    "boto3>=1.43.93",
    "dateparser>=1.4.3",
    "deepdiff>=9.1.0",
    "extruct>=0.18.0",
    "fastapi>=0.141.1",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "markdownify>=1.2.3",
    "prometheus-client>=0.26.0",
    "protego>=0.6.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "rapidfuzz>=3.14.6",
    "redis>=5.3.1",
    "selectolax>=0.4.11",
    "sqlalchemy>=2.0.52",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "trafilatura>=2.2.0",
    "url-normalize>=3.0.0",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-recording>=0.13.4",
    "respx>=0.23.1",
    "ruff>=0.16.7",
    "schemathesis>=4.27.0",
    "semgrep>=1.177.0",
    "testcontainers>=4.15.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is the documented pattern

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["app", "tests"]
exclude = [".venv", "migrations"]

[tool.coverage.run]
source = ["app"]
branch = true
