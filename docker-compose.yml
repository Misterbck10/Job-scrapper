name: job-scraper

services:
  postgres:
    container_name: job-scraper-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - internal

  valkey:
    container_name: job-scraper-valkey
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    env_file:
      - .env
    command:
      - /bin/sh
      - -ec
      - |
        exec valkey-server \
          --appendonly yes \
          --appendfsync everysec \
          --maxmemory-policy noeviction \
          --requirepass "$$VALKEY_PASSWORD"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "REDISCLI_AUTH=$$VALKEY_PASSWORD valkey-cli ping | grep -q PONG",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - internal

volumes:
  postgres_data:
  valkey_data:

networks:
  internal:
    name: job-scraper-internal